[project]
name = "shared-ev-supervision-mcp"
version = "0.1.0"
description = "HTTP MCP bridge for the shared EV supervision Java backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "mcp>=1.28.1,<2",
    "pydantic>=2.13.3,<3",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.46.0,<0.47",
]

[project.scripts]
shared-ev-supervision-mcp = "shared_ev_supervision_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.15.0,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
