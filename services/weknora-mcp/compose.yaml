services:
  weknora-mcp:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${MCP_PUBLISHED_PORT:-8000}:${MCP_PORT:-8000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
