[project]
name = "deerflow-weknora-mcp"
version = "0.1.0"
description = "Read-only WeKnora retrieval exposed over Streamable HTTP MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.2.0",
  "starlette==1.3.1",
  "uvicorn==0.46.0",
]

[project.scripts]
weknora-mcp = "weknora_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weknora_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
